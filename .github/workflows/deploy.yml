name: Automated deploy

on:
  release:
    types: [created]

env:
  VERSION: ${{ github.event.release.tag_name }}
  TARGET_REF: ${{ github.event.release.target_commitish }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: x64+arm64
            node_arch: x64
            command: build:gyp
            universal: 'true'
          - os: windows-2022
            label: x64
            node_arch: x64
            command: build:gyp
          - os: ubuntu-22.04
            label: linux-glibc
            command: build:gyp-cross
            args: --tag-libc -i almalinux-devtoolset11
          - os: ubuntu-22.04
            label: alpine
            command: build:gyp-cross
            args: --tag-libc -i alpine
          - os: ubuntu-22.04
            label: linux-arm
            command: build:gyp-cross
            args: --tag-libc -i linux-arm64 -i linux-armv7 -i linux-armv6
          - os: ubuntu-22.04
            label: linux-arm-musl
            command: build:gyp-cross
            args: --tag-libc -i linux-arm64-musl -i linux-armv7l-musl
          - os: ubuntu-22.04
            label: android-arm
            command: build:gyp-cross
            args: --tag-libc -i android-arm64 -i android-armv7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch }}

      - name: Install dependencies
        env:
          npm_config_enable_thin_lto: 'false'
          npm_config_enable_lto: 'false'
        run: npm ci

      - name: Prebuild package
        # Node 26 (--target 26.x) pulls Node 26's ThinLTO common.gypi, which
        # appends the lld-only /opt:lldltojobs to link.exe and breaks the MSVC
        # Windows build (LNK1117). Force LTO off so the flag is not emitted.
        # Inert on non-Windows / non-Node-26 targets.
        if: matrix.universal != 'true'
        env:
          npm_config_enable_thin_lto: 'false'
          npm_config_enable_lto: 'false'
        run: npm run ${{ matrix.command }} -- ${{ matrix.args }}

      - name: Prebuild universal macOS binary (x64 + arm64, lipo-fused)
        # prebuildify passes only the first arch of an "x64+arm64" tuple to
        # node-gyp, so a single run produces an x86_64-only binary that an
        # arm64 Node cannot load. Build each slice separately, then lipo them
        # into one fat binary per ABI under the darwin-x64+arm64 directory the
        # resolver looks up, and drop the single-arch dirs so only the fat
        # binary ships. Fail if any output is not actually dual-arch.
        if: matrix.universal == 'true'
        shell: bash
        env:
          npm_config_enable_thin_lto: 'false'
          npm_config_enable_lto: 'false'
        run: |
          set -euo pipefail
          npm run ${{ matrix.command }} -- --arch x64
          npm run ${{ matrix.command }} -- --arch arm64
          fat="prebuilds/darwin-x64+arm64"
          mkdir -p "$fat"
          for x in prebuilds/darwin-x64/*.node; do
            name="$(basename "$x")"
            a="prebuilds/darwin-arm64/$name"
            if [ ! -f "$a" ]; then
              echo "::error::missing arm64 slice for $name"; exit 1
            fi
            lipo -create "$x" "$a" -output "$fat/$name"
            archs="$(lipo -archs "$fat/$name")"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) echo "OK $name -> $archs" ;;
              *) echo "::error::$name is not universal: $archs"; exit 1 ;;
            esac
          done
          rm -rf prebuilds/darwin-x64 prebuilds/darwin-arm64
          ls -R prebuilds

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}-${{ matrix.label }}
          path: prebuilds/
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: build-artifacts
          pattern: build-artifacts-*

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: prebuilds

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@NeuraLegion'

      - name: Publish to GPR
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

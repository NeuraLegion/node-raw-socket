name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # unfortunately, raw sockets require elevated privileges to run tests, and neither capabilities nor sudo are supported on Linux runners
      - name: Set raw socket capability (Linux)
        if: runner.os == 'Linux'
        run: sudo setcap cap_net_raw,cap_net_admin,cap_net_bind_service+eip $(which node)

      - name: Install dependencies
        # Node 26's official Windows binary is ThinLTO-built, so node-gyp seeds
        # config.gypi with enable_thin_lto/lto_jobs and common.gypi appends the
        # lld-only /opt:lldltojobs to link.exe, which MSVC rejects (LNK1117) when
        # node-gyp-build source-builds. Force LTO off. Inert on non-Windows.
        env:
          npm_config_enable_thin_lto: 'false'
          npm_config_enable_lto: 'false'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests (Mac)
        if: runner.os == 'macOS'
        run: sudo npm test
      
      - name: Run tests
        if: runner.os != 'macOS'
        run: npm test
